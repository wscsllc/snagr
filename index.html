<meta name="theme-color" content="#0E1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snagr">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='36' rx='4' fill='%23FFE04A'/%3E%3Ccircle cx='4' cy='32' r='6' fill='%2312151A'/%3E%3Ccircle cx='60' cy='32' r='6' fill='%2312151A'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-weight='900' font-size='26' text-anchor='middle' fill='%2312151A'%3E%24%3C/text%3E%3C/svg%3E">

<style>
/* Layout: a pocket price gun. Game switch pinned on top, sticker-tagged rows in the middle, tab bar under the thumb. */
:root {
  --bg: #ECEFF3;          /* binder-sleeve grey */
  --surface: #FFFFFF;
  --surface-2: #F3F5F8;
  --ink: #12151A;
  --ink-2: #4D5765;
  --ink-3: #737D8B;
  --line: #D4DAE2;
  --accent: #2443D0;      /* links, focus */
  --sticker: #FFE04A;     /* price-gun label */
  --sticker-ink: #1C1600;
  --hot: #FF9A4D;         /* fluorescent orange sale sticker */
  --steal: #4AE38D;       /* fluorescent green sale sticker */
  --deal-ink: #0B1A10;
  --good: #11784A;
  --bad: #B42330;
  --warn: #8A5600;
  --holo: linear-gradient(118deg, #FFF1BD 0%, #CDF5FF 28%, #E6D4FF 55%, #FFD6E4 80%, #FFF1BD 100%);
  --holo-ink: #12151A;
  --holo-ink-2: rgba(18, 21, 26, .74);
  --holo-warn: #6B3F00;
  --scrim: rgba(6, 8, 12, .5);
  --shadow: 0 1px 0 rgba(18, 21, 26, .04), 0 8px 22px -12px rgba(18, 21, 26, .28);
  --g-pokemon: #E2AF00;
  --g-mtg: #C0571A;
  --g-yugioh: #7A3EB3;
  --g-onepiece: #CC2437;
  --g-lorcana: #2A61D3;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 12px;
  --tabbar-h: 62px;
  --notch: radial-gradient(circle 4px at 0 50%, #0000 94%, #000 100%) left / 50.5% 100% no-repeat,
           radial-gradient(circle 4px at 100% 50%, #0000 94%, #000 100%) right / 50.5% 100% no-repeat;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1115; --surface: #161A20; --surface-2: #1D222A; --ink: #EDF0F4; --ink-2: #A9B2BF; --ink-3: #7F8998;
    --line: #2A313B; --accent: #91A6FF; --good: #52D28F; --bad: #FF7F88; --warn: #F1B74C;
    --holo: linear-gradient(118deg, #EADCA4 0%, #ACDDE9 28%, #CAB8EE 55%, #ECBACB 80%, #EADCA4 100%);
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 26px -14px rgba(0, 0, 0, .85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1115; --surface: #161A20; --surface-2: #1D222A; --ink: #EDF0F4; --ink-2: #A9B2BF; --ink-3: #7F8998;
  --line: #2A313B; --accent: #91A6FF; --good: #52D28F; --bad: #FF7F88; --warn: #F1B74C;
  --holo: linear-gradient(118deg, #EADCA4 0%, #ACDDE9 28%, #CAB8EE 55%, #ECBACB 80%, #EADCA4 100%);
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 26px -14px rgba(0, 0, 0, .85);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html.locked, html.locked body { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased;
  min-height: 100vh; min-height: 100dvh;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px);
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.top { position: sticky; top: 0; z-index: 30; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); }
@supports (background: color-mix(in srgb, red 50%, blue)) and ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .top { background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: saturate(1.5) blur(14px); backdrop-filter: saturate(1.5) blur(14px); }
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.brand-tag {
  display: inline-grid; place-items: center; min-width: 36px; height: 26px; padding: 0 8px;
  background: var(--sticker); color: var(--sticker-ink); font: 800 19px/1 var(--f-display);
  border-radius: 3px; -webkit-mask: var(--notch); mask: var(--notch);
}
.brand-word { font: 800 27px/1 var(--f-display); letter-spacing: .01em; text-transform: uppercase; }
.brand-sub { font: 500 11px/1 var(--f-mono); color: var(--ink-3); letter-spacing: .1em; align-self: flex-start; margin-top: 3px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--ink-2); font: 700 16px/1 var(--f-body);
}
.games {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px 12px;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.games::-webkit-scrollbar { display: none; }
.game {
  flex: none; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 14px/1 var(--f-body); cursor: pointer;
}
.game .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); }
.game[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Sections */
.view { padding-block: 2px 24px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 20px 0 6px; }
.sec-head > div { min-width: 0; }
.sec-title { margin: 0; font: 800 34px/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.sec-hint { margin: 7px 0 0; color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.stamp { margin: 10px 0; color: var(--ink-3); font: 500 11.5px/1.4 var(--f-mono); letter-spacing: .02em; }
.fine { color: var(--ink-3); font-size: 12.5px; line-height: 1.45; margin: 14px 0 0; max-width: 64ch; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 15px;
  border-radius: 10px; border: 1px solid transparent; background: var(--ink); color: var(--bg);
  font: 600 14px/1 var(--f-body); cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.wide { width: 100%; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: 600 13.5px/1.2 var(--f-body); cursor: pointer; text-decoration: none; }

/* Rows */
.list { display: grid; gap: 8px; }
.row {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); text-align: left; cursor: pointer; color: var(--ink);
}
.row:hover { border-color: var(--ink-3); }
.row-main { display: grid; gap: 2px; min-width: 0; }
.row-name { font-weight: 600; font-size: 15.5px; line-height: 1.25; overflow-wrap: anywhere; }
.row-sub { color: var(--ink-2); font-size: 13px; line-height: 1.3; overflow-wrap: anywhere; }
.row-note { color: var(--ink-3); font-size: 12.5px; line-height: 1.35; }
.row-note .down { color: var(--good); font-weight: 600; }
.row-note .up { color: var(--bad); font-weight: 600; }
.row-price { display: grid; justify-items: end; gap: 6px; }

.thumb { position: relative; display: block; width: 48px; aspect-ratio: 63 / 88; max-width: 100%; border-radius: 4px; overflow: hidden; background: var(--surface-2); flex: none; }
.thumb.sm { width: 40px; }
.thumb.lg { width: min(32vw, 144px); border-radius: 8px; box-shadow: var(--shadow); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 5px;
  background: var(--gc); background-image: linear-gradient(155deg, rgba(255, 255, 255, .3), rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, .22));
  color: #FFFFFF; font: 500 8.5px/1.15 var(--f-mono); text-align: center; letter-spacing: .02em; word-break: break-all;
  text-shadow: 0 1px 1px rgba(0, 0, 0, .35);
}
.tile::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(255, 255, 255, .5); border-radius: 3px; }
.t-pokemon .tile { color: #2A2000; text-shadow: none; }
.t-pokemon .tile::before { border-color: rgba(42, 32, 0, .35); }
.thumb.lg .tile { font-size: 13px; padding: 12px; }

.tag {
  display: inline-flex; align-items: baseline; gap: 4px; padding: 4px 12px 3px;
  background: var(--sticker); color: var(--sticker-ink); font: 800 21px/1 var(--f-display);
  letter-spacing: .01em; border-radius: 3px; font-variant-numeric: tabular-nums; white-space: nowrap;
  -webkit-mask: var(--notch); mask: var(--notch);
}
.tag small { font: 600 9.5px/1 var(--f-body); text-transform: uppercase; letter-spacing: .07em; }
.tag.mute { background: var(--surface-2); color: var(--ink-3); font-size: 15px; }
.pct {
  display: inline-block; padding: 4px 7px; border-radius: 3px; white-space: nowrap;
  font: 700 12px/1 var(--f-body); color: var(--deal-ink); background: var(--steal);
}
.pct.great { background: var(--hot); }
.pct.good { background: transparent; color: var(--good); box-shadow: inset 0 0 0 1.5px currentColor; }
.pct.fair { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.pct.high { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1.5px currentColor; }

/* Loading and notes */
.sk { cursor: default; }
.sk .thumb, .sk-line, .sk-tag { background: var(--surface-2); }
.sk-line { display: block; height: 12px; border-radius: 6px; }
.sk-line + .sk-line { margin-top: 8px; }
.sk-line.short { width: 35%; }
.sk-tag { display: block; width: 66px; height: 27px; border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .sk .thumb, .sk-line, .sk-tag { background: linear-gradient(90deg, var(--surface-2) 0%, var(--line) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
}
@keyframes shimmer { to { background-position: -200% 0; } }
.loading-note { margin: 10px 0; color: var(--ink-2); font-size: 13.5px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; justify-items: start; }
.note p { margin: 0; max-width: 62ch; }
.note.err { border-color: var(--bad); }

/* Hunt */
.search { display: flex; gap: 8px; margin: 16px 0 6px; }
.search-field { position: relative; flex: 1; min-width: 0; }
.search-field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input {
  width: 100%; height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 0 14px 0 44px; font: 500 16px/1 var(--f-body); -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--ink-3); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(36, 67, 208, .2); }
.search .btn { height: 50px; padding: 0 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip {
  height: 36px; padding: 0 14px; border-radius: 999px; border: 1px dashed var(--ink-3); background: transparent;
  color: var(--ink); font: 500 14px/1 var(--f-body); cursor: pointer;
}
.chip:hover { border-style: solid; }
.how { margin-top: 20px; display: grid; gap: 10px; }
.how h2 { margin: 0; font: 800 21px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.how ol { margin: 0; padding-left: 20px; color: var(--ink-2); display: grid; gap: 6px; max-width: 60ch; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab {
  position: relative; height: var(--tabbar-h); display: grid; place-items: center; align-content: center; gap: 4px;
  background: none; border: 0; cursor: pointer; color: var(--ink-3); font: 600 12px/1 var(--f-body);
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 32%; right: 32%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }
.badge {
  position: absolute; top: 7px; left: calc(50% + 7px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--sticker); color: var(--sticker-ink); font: 700 11px/18px var(--f-body); text-align: center;
}
.badge.mute { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 60; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--scrim); }
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 760px;
  max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, .28);
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}
@media (prefers-reduced-motion: no-preference) {
  .sheet-backdrop { animation: fade .2s ease-out; }
  .sheet-panel { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(64px); } }
.sheet-head {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line); border-radius: 18px 18px 0 0;
}
.sheet-titles { min-width: 0; flex: 1; }
.sheet-eyebrow { font: 600 11px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.sheet-title { margin: 3px 0 0; font: 700 16px/1.2 var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.close { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--ink); flex: none; }
.sheet-body {
  display: grid; gap: 18px; padding-block: 16px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-body > * { min-width: 0; }

/* Card detail */
.d-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: end; }
.d-name { margin: 0; font: 800 clamp(26px, 7.4vw, 38px)/.95 var(--f-display); text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.d-sub { margin: 7px 0 10px; color: var(--ink-2); font-size: 14px; }
@media (max-width: 340px) { .d-hero { grid-template-columns: 1fr; } .thumb.lg { width: 132px; } }

.holo {
  position: relative; overflow: hidden; border-radius: 16px; padding: 16px 16px 18px;
  background: var(--holo); background-size: 220% 220%; color: var(--holo-ink);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .55), var(--shadow); display: grid; gap: 3px; justify-items: start;
}
.holo::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(112deg, rgba(255, 255, 255, 0) 0 14px, rgba(255, 255, 255, .22) 14px 15px); }
.holo > * { position: relative; z-index: 1; }
@media (prefers-reduced-motion: no-preference) { .holo { animation: sheen 10s ease-in-out infinite alternate; } }
@keyframes sheen { from { background-position: 0% 40%; } to { background-position: 100% 60%; } }
.holo-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; width: 100%; }
.eyebrow { font: 700 11px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--holo-ink-2); }
.big { margin-top: 6px; font: 800 54px/1 var(--f-display); letter-spacing: .005em; font-variant-numeric: tabular-nums; }
.h-l1 { margin: 2px 0 0; font-weight: 700; font-size: 15px; }
.h-l2 { margin: 0; font-size: 14px; color: var(--holo-ink-2); }
.h-l3 { margin: 6px 0 0; font-size: 14px; font-weight: 600; }
.h-warn { margin: 6px 0 0; font-size: 13px; color: var(--holo-warn); max-width: 52ch; }
.cta {
  margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px;
  border-radius: 11px; background: var(--holo-ink); color: #FFFFFF; text-decoration: none; font: 600 15px/1 var(--f-body);
}

.block { display: grid; gap: 10px; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.block h3 { margin: 0; font: 800 23px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.block > .fine { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { height: 34px; padding: 0 12px; border: 0; background: none; cursor: pointer; font: 600 13px/1 var(--f-body); color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.stores { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.store {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 11px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: 14px;
}
.store b { font: 800 20px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.store.best { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

.prs { display: grid; gap: 8px; }
.pr { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.pr.focus { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pr-head { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; }
.pr-title { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.pr-meta { margin-top: 3px; color: var(--ink-2); font: 500 11.5px/1.4 var(--f-mono); overflow-wrap: anywhere; }

  }
  const entry = { t: Date.now(), v: body };
  mem.set(url, entry);
  if (persist) saveCache('c:' + url, entry);

/* ------------------------------------------------------------------ games */
const GAMES = {

/* ------------------------------------------------------------------ deal math

const OUTLIER = 0.6; // a listing more than 60% under market is usually damaged, a proxy or mislabeled

const A = {};

    if (num(p.low) != null) offers.push({ store: 'TCGplayer', tag: 'Low', kind: 'ask', price: num(p.low), cur: 'USD', url: tpUrl });
    if (num(p.directLow) != null) offers.push({ store: 'TCGplayer Direct', tag: 'Direct', kind: 'ask', price: num(p.directLow), cur: 'USD', url: tpUrl });
    if (k === 'reverseHolofoil') offers.push(...cmOffers(true));

}

  const offers = [];

  if (num(c.inventory_price) != null) offers.push({ store: 'TCGplayer', tag: 'Listed', kind: 'ask', price: num(c.inventory_price), cur: 'USD', url });

    id: c.card_image_id || c.card_set_id, setName: c.set_name || '', setCode: c.card_set_id || '', number: '', rarity: c.rarity || '', released: '',
    image: c.card_image || null, imageLarge: c.card_image || null, variants: [{ label: opVariantLabel(c), key: 'v', offers }], updated: c.date_scraped || null,

/* ------------------------------------------------------------------ render bits */

/* ------------------------------------------------------------------ deals */
async function ensureRadar(force) {
  const game = state.game, G = GAMES[game];
  if (!G.radar) return;
  const cur = state.radar[game];
  if (!force && cur && (cur.status === 'loading' || (cur.status === 'ok' && Date.now() - cur.at < 20 * 60e3))) return;
  state.radar[game] = { status: 'loading', started: Date.now() };
  if (state.tab === 'deals' && state.game === game) renderDeals();
  try {
    const deals = await A[game].radar();
    state.radar[game] = { status: 'ok', deals, at: Date.now() };
  } catch (e) {
    state.radar[game] = { status: 'error', err: e };
  }
  if (state.tab === 'deals' && state.game === game) renderDeals();
}
function refreshRadar() {
  dropCache(GAMES[state.game].host);
  ensureRadar(true);
}
function dealRow(d, i) {
  return `<button class="row" type="button" data-act="open-deal" data-i="${i}">${thumb(d.image, d.game, d.code)}<span class="row-main"><span class="row-name">${esc(d.name)}</span><span class="row-sub">${esc(d.where)}</span><span class="row-note">${esc(d.why)}</span></span><span class="row-price"><span class="tag">${money(d.price)}</span>${pctBadge(d.pct)}</span></button>`;
}
function renderDeals() {
  const G = GAMES[state.game], r = state.radar[state.game];
  let body = '';
  if (!G.radar) {
    body = `<div class="note"><p><b>Lorcana deals need listing prices.</b> Lorcast, the free Lorcana price feed, only carries market prices, so there are no listings to compare against yet. Search a card instead to find its cheapest printing.</p>${chips(G)}</div>`;
  } else if (!r || r.status === 'loading') {
    body = `<p class="loading-note" role="status">${esc(G.radar.loading)}</p>${skeleton(6)}`;
  } else if (r.status === 'error') {
    body = errorNote(r.err, 'retry-radar');
  } else if (!r.deals.length) {
    body = `<div class="note"><p><b>No standout deals right now.</b> Nothing in this scan is priced well under market. Check back later, or search a specific card.</p>${chips(G)}</div>`;
  } else {
    body = `<p class="stamp">${r.deals.length} deals · checked ${esc(ago(r.at))} · ${esc(G.source)}</p><div class="list">${r.deals.map(dealRow).join('')}</div>`;
  }
  const busy = r && r.status === 'loading';
  $('#view-deals').innerHTML = `<div class="sec-head"><div><h1 class="sec-title">${esc(G.short)} deals</h1><p class="sec-hint">${esc(G.radar ? G.radar.hint : 'Search any Lorcana card to compare every printing.')}</p></div>${G.radar ? `<button class="btn btn-ghost" type="button" data-act="refresh-radar"${busy ? ' disabled' : ''}>Refresh</button>` : ''}</div>${body}<p class="fine">${esc(G.fine)}</p>`;
}

/* ------------------------------------------------------------------ hunt */
function queueSearch(q, delay) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(q), delay);
}
async function runSearch(raw) {
  const q = String(raw || '').trim();
  state.q = q;
  if (searchCtl) searchCtl.abort();
  if (q.length < 2) { state.hunt = { status: 'idle', groups: [] }; renderHunt(); return; }
  const game = state.game;
  const ctl = searchCtl = new AbortController();
  state.hunt = { status: 'loading', groups: [], q, game };
  renderHunt();
  try {
    const groups = await A[game].search(q, ctl.signal);
    if (ctl.signal.aborted) return;
    groups.forEach(finishGroup);
    state.hunt = { status: 'ok', groups, q, game };
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    state.hunt = { status: 'error', groups: [], err: e, q, game };
  }
  if (state.game === game && state.q === q) renderHunt();
}
function groupRow(g, i) {
  const f = g.from || {};
  return `<button class="row" type="button" data-act="open-group" data-i="${i}">${thumb(g.image, g.game, g.code)}<span class="row-main"><span class="row-name">${esc(g.name)}</span><span class="row-sub">${esc(g.sub || '')}</span>${f.note ? `<span class="row-note">${esc(f.note)}</span>` : ''}</span><span class="row-price">${f.price != null ? `<span class="tag"><small>from</small>${money(f.price)}</span>` : '<span class="tag mute">No price</span>'}${g.deal ? pctBadge(g.deal.pct) : ''}</span></button>`;
}
function renderHunt() {
  const G = GAMES[state.game], h = state.hunt;
  $('#q').placeholder = `Search ${G.short} cards`;
  let body;
  if (!state.q || state.q.length < 2) {
    body = `${chips(G)}<div class="how"><h2>How hunting works</h2><ol><li>Search a card to see every printing and what each store charges.</li><li>The yellow tag is the cheapest way to buy it. Green and orange stickers mark prices under market.</li><li>Tap the star on a version, set the price you’d pay, and track it in Watchlist.</li></ol></div><p class="fine">${esc(G.fine)}</p>`;
  } else if (h.status === 'loading') {
    body = `<p class="loading-note" role="status">Looking up “${esc(state.q)}” on ${esc(G.source)}…</p>${skeleton(5)}`;
  } else if (h.status === 'error') {
    body = errorNote(h.err, 'retry-search');
  } else if (!h.groups.length) {
    body = `<div class="note"><p><b>No ${esc(G.short)} cards match “${esc(state.q)}”.</b> Check the spelling, try fewer words, or switch games above.</p></div>`;
  } else {
    body = `<p class="stamp">${h.groups.length} result${h.groups.length > 1 ? 's' : ''} · ${esc(G.source)}</p><div class="list">${h.groups.map(groupRow).join('')}</div><p class="fine">${esc(G.fine)}</p>`;
  }
  $('#huntBody').innerHTML = body;
}

/* ------------------------------------------------------------------ card sheet */
function openSheet() {

function closeSheet() {

}
async function openGroup(g, focusId) {

  sheetAbort = new AbortController();
  const sig = sheetAbort.signal;
  detail = { group: g, focusId: focusId || null, sort: 'price', showAll: false, editing: null, status: g.printings ? 'ok' : 'loading', retry: () => openGroup(g, focusId) };
  openSheet();

  renderDetail();
  if (!g.printings && A[g.game].loadPrintings) {
    try {

      detail.status = 'ok';
    } catch (e) {

    }
    renderDetail();
  }
}
async function openFromWatch(wid) {
  const w = state.watch.find(x => x.id === wid);
  if (!w) return;
  sheetAbort.abort();
  sheetAbort = new AbortController();
  const sig = sheetAbort.signal;
  const stub = { game: w.game, name: w.name, printings: null, sub: GAMES[w.game].name, image: w.image, code: w.code };
  detail = { group: stub, focusId: w.pid.startsWith('store:') ? null : w.pid, sort: 'price', showAll: false, editing: null, status: 'loading', retry: () => openFromWatch(wid) };
  openSheet();
  renderDetail();
  try {
    const q = w.game === 'lorcana' ? ((w.extra && w.extra.q) || w.name) : w.name;
    const groups = await A[w.game].search(q, sig);
    const g = groups.find(x => x.printings && x.printings.some(p => p.id === w.pid))
      || groups.find(x => w.extra && w.extra.cardId && x.cardId === w.extra.cardId)
      || groups.find(x => norm(x.name) === norm(w.name)) || null;
    if (!g) throw new NetError('This card no longer turns up in search results.', 'http');
    if (!g.printings && A[w.game].loadPrintings) await A[w.game].loadPrintings(g, sig);
    if (!detail || sig.aborted) return;
    finishGroup(g);
    detail.group = g;
    detail.status = 'ok';
    detail.retry = () => openGroup(g, detail && detail.focusId);
  } catch (e) {
    if ((e && e.name === 'AbortError') || !detail) return;
    detail.status = 'error';
    detail.err = e;
  }
  renderDetail();
}
function findPV(g, pid, vkey) {
  if (vkey === 'store') {
    const v = { label: 'Lowest store price', key: 'store', offers: (g.storeOffers || []).filter(o => o.cur === 'USD') };
    return { p: { id: pid, setName: 'Any printing', setCode: g.code || '', number: '', variants: [v], image: g.image }, v };
  }
  const p = (g.printings || []).find(x => x.id === pid);
  const v = p && p.variants.find(x => x.key === vkey);
  return p && v ? { p, v } : null;
}
function holo(o) {
  return `<section class="holo" aria-label="${esc(o.eyebrow)}"><div class="holo-top"><span class="eyebrow">${esc(o.eyebrow)}</span>${o.tier ? `<span class="pct ${o.tier.id}">${esc(o.tier.label)}</span>` : ''}</div><div class="big">${money(o.price)}</div><p class="h-l1">${esc(o.line1)}</p>${o.line2 ? `<p class="h-l2">${esc(o.line2)}</p>` : ''}${o.line3 ? `<p class="h-l3">${esc(o.line3)}</p>` : ''}${o.caution ? '<p class="h-warn">Some listings sit far below market. Those are often played or damaged copies, so check the condition and seller before you buy.</p>' : ''}${o.url ? `<a class="cta" href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.cta)} <span aria-hidden="true">↗</span></a>` : ''}</section>`;
}
function bestBlock(g) {
  const ev = evalGroup(g);
  let pick = null;
  if (detail.focusId) {
    const p = (g.printings || []).find(x => x.id === detail.focusId);
    if (p) pick = p.variants.map(v => ({ p, v, e: evalVariant(v) })).filter(x => x.e.best).sort((a, b) => ((b.e.pct == null ? -9 : b.e.pct) - (a.e.pct == null ? -9 : a.e.pct)) || a.e.best.price - b.e.best.price)[0] || null;
  }
  const focused = !!pick;
  if (!pick) pick = ev.cheapest;
  if (!focused && ev.storeBest && (!pick || ev.storeBest.price <= pick.e.best.price)) {
    const s = ev.storeBest;
    return holo({ eyebrow: 'Best price found', price: s.price, line1: `${s.store} · lowest listed for any printing`, line2: ev.typical ? `Typical printing: ${money(ev.typical)}` : '', url: s.url, cta: `Shop ${s.store}` });
  }
  if (!pick) return '<div class="note"><p><b>No prices listed right now.</b> The source has this card but no current price for it.</p></div>';
  const { p, v, e } = pick, b = e.best;
  const kind = b.kind === 'ask' ? (b.tag === 'Listed' ? 'listed price' : b.tag === 'Direct' ? 'lowest Direct listing' : 'lowest listing') : b.tag === 'Set price' ? 'set price via YGOPRODeck' : 'market price';
  let line3 = '';
  if (e.pct != null) line3 = e.pct >= 0 ? `${pctText(e.pct)} under the ${money(e.market)} market price` : `${pctText(e.pct)} over the ${money(e.market)} market price`;
  else if (ev.typical && ev.typical > b.price * 1.05 && (g.printings || []).length > 1) line3 = `Cheapest version. The typical printing runs ${money(ev.typical)}.`;
  const setPrice = b.tag === 'Set price';
  return holo({
    eyebrow: focused ? 'This deal' : 'Best way to buy', price: b.price, line1: setPrice ? 'Set price via YGOPRODeck' : `${b.store} · ${kind}`,
    line2: `${p.setName}${p.number ? ' · #' + p.number : ''} · ${v.label}`, line3, url: b.url, cta: setPrice ? 'Find it on TCGplayer' : `Open on ${b.store.replace(' Direct', '')}`,
    tier: e.pct != null && !e.caution ? tier(e.pct) : null, caution: e.caution || e.outlier,
  });
}
function watchForm(wid, cur) {

  const def = w ? w.target : Math.max(0.01, Math.floor((cur || 1) * 0.9 * 100) / 100);

}
function offerChip(o, e) {

  const inner = `<span class="st">${esc(o.tag)}</span><b>${money(o.price, o.cur)}</b>${o.stale ? '<span class="st">older</span>' : ''}`;
  const cls = `offer${best ? ' best' : ''}${o.stale ? ' old' : ''}`;

function printingCard(g, p) {

function printingsBlock(g) {

function toggleWatchForm(pid, vkey) {
  if (!detail) return;
  const wid = watchId(detail.group.game, pid, vkey);
  detail.editing = detail.editing === wid ? null : wid;
  renderDetail();
  if (detail.editing) {
    requestAnimationFrame(() => {
      const inp = $('#wt');
      if (inp) { inp.focus({ preventScroll: true }); inp.select(); inp.closest('.wf').scrollIntoView({ block: 'nearest' }); }
    });
  }
}
function saveWatchForm(f) {
  if (!detail) return;
  const wid = f.dataset.wid;
  const target = Math.round(parseFloat(f.elements.target.value) * 100) / 100;
  if (!(target > 0)) { toast('Enter a target price above $0.'); return; }
  const [game, pid, vkey] = splitWid(wid);
  const g = detail.group;
  const pv = findPV(g, pid, vkey);
  if (!pv) return;
  const e = evalVariant(pv.v);
  const existing = state.watch.find(w => w.id === wid);
  if (existing) existing.target = target;
  else {
    state.watch.unshift({
      id: wid, game, pid, vkey, name: g.name,
      where: `${pv.p.setName}${pv.p.number ? ' · #' + pv.p.number : ''} · ${pv.v.label}`,
      image: pv.p.image || g.image || null, code: pv.p.setCode || g.code || '', target,
      start: e.best ? e.best.price : null, last: e.best ? e.best.price : null, lastAt: Date.now(), url: e.best ? e.best.url : null,
      extra: game === 'yugioh' ? { cardId: g.cardId } : game === 'lorcana' ? { q: g.baseName || g.name } : null,
    });
  }
  saveWatch();
  detail.editing = null;
  renderDetail();
  toast(existing ? 'Target updated' : `Watching ${g.name}`);
}

/* ------------------------------------------------------------------ watchlist */
async function checkWatch() {
  if (state.checking || !state.watch.length) return;
  state.checking = true;
  renderWatch();
  const byGame = {};
  for (const w of state.watch) (byGame[w.game] = byGame[w.game] || []).push(w);
  for (const [game, items] of Object.entries(byGame)) {
    let res = null;
    try { res = await A[game].refresh(items); } catch { res = null; }
    for (const w of items) {
      const r = res && res[w.id];
      if (r && r.price != null) { w.last = r.price; w.url = r.url || w.url; w.lastAt = Date.now(); w.err = false; }
      else w.err = true;
    }
    saveWatch();
    if (state.tab === 'watch') renderWatch();
  }
  state.checking = false;
  store.set('lastCheck', Date.now());
  if (state.tab === 'watch') renderWatch();
  const hits = state.watch.filter(isHit).length;
  const failed = state.watch.filter(w => w.err).length;
  toast(hits ? `${hits} target${hits > 1 ? 's' : ''} hit` : failed ? `Checked. ${failed} card${failed > 1 ? 's' : ''} couldn’t be refreshed.` : 'Checked. No targets hit yet.');
}
function watchRow(w, i) {
  const hit = isHit(w);
  const d = w.last != null && w.start != null ? w.last - w.start : null;
  const change = d && Math.abs(d) >= 0.01 ? ` · <span class="${d < 0 ? 'down' : 'up'}">${d < 0 ? '▼' : '▲'} ${money(Math.abs(d))}</span> since added` : '';
  let extra;
  if (state.wEdit === w.id) {
    extra = `<form class="wedit" data-wid="${esc(w.id)}"><label for="we${i}">New target</label><div class="wf-row"><span class="money-in"><span aria-hidden="true">$</span><input id="we${i}" name="target" type="number" inputmode="decimal" min="0.01" step="0.01" value="${Number(w.target).toFixed(2)}" required></span><button class="btn" type="submit">Save</button><button class="btn btn-ghost" type="button" data-act="w-cancel">Cancel</button></div></form>`;
  } else if (state.wRemove === w.id) {
    extra = `<div class="wf-row"><span>Remove this card?</span><button class="btn" type="button" data-act="w-remove-yes" data-wid="${esc(w.id)}">Remove</button><button class="btn btn-ghost" type="button" data-act="w-cancel">Keep</button></div>`;
  } else {
    extra = `<div class="wactions"><button class="link" type="button" data-act="w-open" data-wid="${esc(w.id)}">Open</button><button class="link" type="button" data-act="w-edit" data-wid="${esc(w.id)}">Edit target</button><button class="link" type="button" data-act="w-remove" data-wid="${esc(w.id)}">Remove</button>${w.url ? `<a class="link" href="${esc(w.url)}" target="_blank" rel="noopener">Shop ↗</a>` : ''}</div>`;
  }
  return `<div class="wrow${hit ? ' hit' : ''}">${thumb(w.image, w.game, w.code)}<div class="row-main"><span class="row-name">${esc(w.name)}</span><span class="row-sub">${esc(GAMES[w.game] ? GAMES[w.game].short : '')} · ${esc(w.where)}</span><span class="row-note">Target ${money(w.target)}${change}${w.err ? ' · last check failed' : ''}</span></div><div class="row-price">${w.last != null ? `<span class="tag">${money(w.last)}</span>` : '<span class="tag mute">—</span>'}${hit ? '<span class="pct steal">Target hit</span>' : ''}</div><div class="wrow-extra">${extra}</div></div>`;
}
function renderWatch() {
  const items = state.watch.map((w, i) => [w, i]).sort((a, b) => (isHit(b[0]) - isHit(a[0])) || a[1] - b[1]).map(x => x[0]);
  const last = store.get('lastCheck', null);
  let html = `<div class="sec-head"><div><h1 class="sec-title">Watchlist</h1><p class="sec-hint">Target prices you set on specific versions. Cards at or under target float to the top.</p></div>${items.length ? `<button class="btn" type="button" data-act="check"${state.checking ? ' disabled' : ''}>${state.checking ? 'Checking…' : 'Check prices'}</button>` : ''}</div>`;
  if (!items.length) {
    html += '<div class="note"><p><b>Nothing watched yet.</b> Open any card, tap the star next to the version you want, and set the price you’d pay.</p><button class="btn btn-ghost" type="button" data-tab="hunt">Find a card</button></div>';
  } else {
    if (last) html += `<p class="stamp">Last checked ${esc(ago(last))} · saved in this browser</p>`;
    html += `<div class="list">${items.map(watchRow).join('')}</div>`;
  }
  $('#view-watch').innerHTML = html;
}

/* ------------------------------------------------------------------ info */
function openInfo() {
  sheetAbort.abort();
  sheetAbort = new AbortController();
  detail = null;
  openSheet();
  $('#sheetEyebrow').textContent = 'Snagr';
  $('#sheetTitle').textContent = 'How it works';
  $('#sheetBody').innerHTML = `<section class="info">
    <h3>What counts as a deal</h3>
    <dl>
      <dt>Pokémon and One Piece</dt><dd>A TCGplayer listing priced under the card’s market price, which tracks what it has recently sold for.</dd>
      <dt>Magic, Yu-Gi-Oh! and Lorcana</dt><dd>The cheapest printing of a card compared with its typical printing. These feeds carry market prices rather than single listings.</dd>
    </dl>
    <h3>Where prices come from</h3>
    <ul>
      <li><a href="https://pokemontcg.io" target="_blank" rel="noopener">Pokémon TCG API</a>: TCGplayer low, market and Direct prices, plus Cardmarket in euros.</li>
      <li><a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>: TCGplayer market (USD) and Cardmarket trend (EUR) for Magic, updated daily.</li>
      <li><a href="https://ygoprodeck.com" target="_blank" rel="noopener">YGOPRODeck</a>: TCGplayer, CoolStuffInc, Amazon, eBay and Cardmarket prices for Yu-Gi-Oh!</li>
      <li><a href="https://optcgapi.com" target="_blank" rel="noopener">OPTCG API</a>: TCGplayer market and listed prices for One Piece, refreshed daily.</li>
      <li><a href="https://lorcast.com" target="_blank" rel="noopener">Lorcast</a>: TCGplayer market prices for Lorcana.</li>
    </ul>
    <h3>Before you buy</h3>
    <p>The lowest listing can be a played or damaged copy, another language, or a seller with high shipping. Check the condition and the total with shipping on the store page.</p>
    <h3>Your watchlist</h3>
    <p>It lives in this browser on this device and isn’t uploaded anywhere. Clearing your browser data removes it.</p>
    <h3>Put it on your home screen</h3>
    <p>Open this page in Safari or Chrome, tap Share (or the ⋮ menu), then Add to Home Screen. It opens like an app.</p>
    <p class="fine">Not affiliated with The Pokémon Company, Wizards of the Coast, Konami, Bandai or Disney. Card names and images belong to their owners.</p>
  </section>`;
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-game],[data-tab],[data-close]');
  if (!t) return;
  if (t.dataset.game) { setGame(t.dataset.game); return; }
  if (t.dataset.tab) { if (t.tagName === 'A') ev.preventDefault(); if (!$('#sheet').hidden) closeSheet(); setTab(t.dataset.tab); return; }
  if (t.hasAttribute('data-close')) { closeSheet(); return; }
  const act = t.dataset.act;
  const deals = state.radar[state.game] && state.radar[state.game].deals;
  switch (act) {
    case 'info': openInfo(); break;
    case 'refresh-radar': refreshRadar(); break;
    case 'retry-radar': ensureRadar(true); break;
    case 'retry-search': runSearch(state.q); break;
    case 'retry-detail': if (detail && detail.retry) detail.retry(); break;
    case 'suggest': if (!$('#sheet').hidden) closeSheet(); $('#q').value = t.dataset.q; setTab('hunt'); runSearch(t.dataset.q); break;
    case 'open-deal': { const d = deals && deals[+t.dataset.i]; if (d && d.group) openGroup(d.group, d.focus); break; }
    case 'open-group': { const g = state.hunt.groups[+t.dataset.i]; if (g) openGroup(g); break; }
    case 'sort': if (detail) { detail.sort = t.dataset.sort; renderDetail(); } break;
    case 'show-all': if (detail) { detail.showAll = true; renderDetail(); } break;
    case 'all-printings': { const name = detail && detail.group.name; closeSheet(); setTab('hunt'); $('#q').value = name || ''; runSearch(name || ''); break; }
    case 'watch': toggleWatchForm(t.dataset.p, t.dataset.v); break;
    case 'cancel-watch': if (detail) { detail.editing = null; renderDetail(); } break;
    case 'unwatch': removeWatch(t.dataset.wid); if (detail) { detail.editing = null; renderDetail(); } break;
    case 'check': checkWatch(); break;
    case 'w-open': openFromWatch(t.dataset.wid); break;
    case 'w-edit': state.wEdit = t.dataset.wid; state.wRemove = null; renderWatch(); requestAnimationFrame(() => { const i = document.querySelector('.wedit input'); if (i) { i.focus(); i.select(); } }); break;
    case 'w-remove': state.wRemove = t.dataset.wid; state.wEdit = null; renderWatch(); break;
    case 'w-remove-yes': removeWatch(t.dataset.wid); state.wRemove = null; renderWatch(); break;
    case 'w-cancel': state.wEdit = null; state.wRemove = null; renderWatch(); break;
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target;
  if (f.id === 'searchForm') { ev.preventDefault(); clearTimeout(searchTimer); runSearch($('#q').value); $('#q').blur(); return; }
  if (f.classList.contains('wf')) { ev.preventDefault(); saveWatchForm(f); return; }
  if (f.classList.contains('wedit')) {
    ev.preventDefault();
    const w = state.watch.find(x => x.id === f.dataset.wid);
    const target = Math.round(parseFloat(f.elements.target.value) * 100) / 100;
    if (!w) return;
    if (!(target > 0)) { toast('Enter a target price above $0.'); return; }
    w.target = target;
    state.wEdit = null;
    saveWatch();
    renderWatch();
    toast('Target updated');
  }
});
$('#q').addEventListener('input', ev => queueSearch(ev.target.value, 450));
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* ------------------------------------------------------------------ start */
renderGames();
renderBadge();
const startTab = (location.hash || '').replace('#', '');
setTab(['deals', 'hunt', 'watch'].includes(startTab) ? startTab : 'deals');
})();
</script>
