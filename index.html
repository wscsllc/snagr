<style>
/* Layout: a clean white price list. Game pills on top, one column of cards with the price on the right, tabs under the thumb. */
:root {
  --bg: #FFFFFF;
  --ink: #141317;
  --ink-2: #5D5966;
  --ink-3: #8C8895;
  --line: #ECEAF0;
  --soft: #F6F5F8;
  --pink: #E8317A;       /* brand mark, hearts */
  --pink-soft: #FFF0F6;
  --pink-line: #F9CFE1;
  --green: #0E7A52;
  --green-soft: #E3F5EC;
  --red: #BD2F49;
  --f: "M PLUS Rounded 1c", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar-h: 62px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
html.locked, html.locked body { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.5 var(--f); -webkit-font-smoothing: antialiased;
  min-height: 100vh; min-height: 100dvh;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 18px);
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
a { color: inherit; }
b, strong { font-weight: 800; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.top { position: sticky; top: 0; z-index: 30; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; }
.logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.logo svg { width: 28px; height: 28px; flex: none; }
.logo span { font: 800 27px/1 var(--f); letter-spacing: -.035em; }
.help {
  width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg);
  display: grid; place-items: center; cursor: pointer; color: var(--ink-2); font: 800 16px/1 var(--f);
}
.games {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 12px;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.games::-webkit-scrollbar { display: none; }
.game {
  flex: none; height: 38px; padding: 0 15px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg);
  color: var(--ink); font: 700 14px/1 var(--f); cursor: pointer; white-space: nowrap;
}
.game[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }

/* Sections */
.view { padding-block: 6px 24px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0 4px; }
.head h1 { margin: 0; font: 800 26px/1.15 var(--f); letter-spacing: -.02em; text-wrap: balance; }
.hint { margin: 0 0 14px; color: var(--ink-2); font-size: 15px; max-width: 56ch; }
.fine { color: var(--ink-3); font-size: 13px; line-height: 1.55; margin: 18px 0 0; max-width: 60ch; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; padding: 0 20px;
  border-radius: 999px; border: 0; background: var(--ink); color: #FFFFFF; font: 700 15px/1 var(--f);
  cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn.heart { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--pink-line); }
.btn.heart svg { color: var(--pink); }
.btn.heart[aria-pressed="true"] { background: var(--pink); color: #FFFFFF; box-shadow: none; }
.btn.heart[aria-pressed="true"] svg { color: #FFFFFF; }
.textlink { background: none; border: 0; padding: 0; color: var(--ink); font: 700 14.5px/1.3 var(--f); cursor: pointer; text-decoration: underline; text-decoration-color: var(--pink-line); text-decoration-thickness: 2px; text-underline-offset: 4px; }

/* Lists */
.list { display: grid; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  width: 100%; padding: 12px 2px; background: none; border: 0; border-bottom: 1px solid var(--line);
  text-align: left; cursor: pointer; color: var(--ink); text-decoration: none;
}
.row:hover, .row:active { background: var(--soft); }
.row-main { display: grid; gap: 1px; min-width: 0; }
.name { font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.sub { color: var(--ink-2); font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
.row-price { display: grid; justify-items: end; gap: 3px; text-align: right; }
.price { font-weight: 800; font-size: 17px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.price small { font-weight: 700; font-size: 12px; color: var(--ink-3); margin-right: 3px; }
.save { display: inline-block; font-size: 12.5px; font-weight: 800; color: var(--green); background: var(--green-soft); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.muted { color: var(--ink-3); font-size: 12.5px; font-weight: 700; white-space: nowrap; }

.thumb { position: relative; display: block; width: 48px; aspect-ratio: 63 / 88; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--soft); flex: none; }
.thumb.sm { width: 40px; border-radius: 5px; }
.thumb.lg { width: min(34vw, 150px); border-radius: 10px; box-shadow: 0 10px 24px -14px rgba(20, 19, 23, .45); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile { position: absolute; inset: 0; display: grid; place-items: center; padding: 5px; text-align: center; color: var(--ink-3); font: 800 9px/1.15 var(--f); word-break: break-word; border: 1.5px solid var(--line); border-radius: inherit; }
.thumb.lg .tile { font-size: 14px; padding: 12px; }

/* Loading and notes */
.loading-text { margin: 4px 0 12px; color: var(--ink-2); font-weight: 700; font-size: 15px; }
.sk { cursor: default; }
.sk:hover { background: none; }
.sk .thumb, .sk-line, .sk-price { background: var(--soft); }
.sk-line { display: block; height: 12px; border-radius: 6px; }
.sk-line + .sk-line { margin-top: 8px; }
.sk-line.short { width: 40%; }
.sk-price { display: block; width: 58px; height: 18px; border-radius: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .sk .thumb, .sk-line, .sk-price { background: linear-gradient(90deg, var(--soft) 0%, var(--line) 50%, var(--soft) 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
}
@keyframes shimmer { to { background-position: -200% 0; } }
.note { display: grid; gap: 12px; justify-items: start; padding: 16px; border-radius: 16px; background: var(--soft); }
.note p { margin: 0; max-width: 58ch; }
.note.err { background: #FFF2F4; }
.note.err p { color: #7A1E30; }

/* Search */
.search { display: flex; gap: 8px; margin: 18px 0 6px; }
.search-field { position: relative; flex: 1; min-width: 0; }
.search-field > svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input {
  width: 100%; height: 50px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--soft);
  color: var(--ink); padding: 0 46px; font: 700 16px/1 var(--f); -webkit-appearance: none; appearance: none;
}
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--ink-3); font-weight: 500; }
.search input:focus { outline: none; border-color: var(--ink); background: var(--bg); }
.clear { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; }
.search .btn { min-height: 50px; }
.label { margin: 18px 0 10px; color: var(--ink-2); font-weight: 700; font-size: 14.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 15px; border-radius: 999px; border: 0; background: var(--soft); color: var(--ink); font: 700 14.5px/1 var(--f); cursor: pointer; }
.chip:hover { background: var(--line); }

/* Store buttons */
.apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.app {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 50px; padding: 8px 14px;
  border-radius: 14px; background: var(--soft); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14.5px; line-height: 1.2;
}
.app:hover { background: var(--line); }
.app b { font-size: 14.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--bg); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { position: relative; height: var(--tabbar-h); display: grid; place-items: center; align-content: center; gap: 3px; background: none; border: 0; cursor: pointer; color: var(--ink-3); font: 700 12px/1 var(--f); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] svg { color: var(--pink); }
.badge { position: absolute; top: 7px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pink); color: #FFFFFF; font: 800 11px/18px var(--f); text-align: center; }
.badge.mute { background: var(--soft); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 60; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(20, 19, 23, .4); }
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px;
  max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(20, 19, 23, .2);
  padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px));
}
@media (prefers-reduced-motion: no-preference) {
  .sheet-backdrop { animation: fade .2s ease-out; }
  .sheet-panel { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(60px); } }
.sheet-head {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line); border-radius: 22px 22px 0 0;
}
.sheet-title { margin: 0; flex: 1; min-width: 0; font: 800 17px/1.25 var(--f); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.close { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--soft); cursor: pointer; display: grid; place-items: center; color: var(--ink); flex: none; }
.sheet-body {
  display: grid; gap: 22px; padding-block: 18px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-body > * { min-width: 0; }
.sheet-body h3 { margin: 0 0 10px; font: 800 18px/1.25 var(--f); }

/* Card detail */
.d-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: end; }
.d-name { margin: 0; font: 800 clamp(23px, 6.4vw, 30px)/1.12 var(--f); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: break-word; }
.d-sub { margin: 6px 0 10px; color: var(--ink-2); font-size: 14.5px; }
@media (max-width: 340px) { .d-hero { grid-template-columns: 1fr; } }
.best { display: grid; gap: 2px; justify-items: start; padding: 18px; border-radius: 20px; background: var(--pink-soft); }
.best-label { font-weight: 700; font-size: 14px; color: var(--ink-2); }
.big { font: 800 46px/1.08 var(--f); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.where { margin: 2px 0 0; font-weight: 700; }
.ver { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.saving { margin: 8px 0 0; font-weight: 800; color: var(--green); }
.pricey { margin: 8px 0 0; font-weight: 700; color: var(--red); }
.warn { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); max-width: 50ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.wf { width: 100%; display: grid; gap: 10px; margin-top: 14px; padding: 14px; border-radius: 16px; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line); }
.versions .wf { margin: 4px 0 12px; }
.wf label { font-weight: 800; font-size: 15px; }
.wf .fine { margin: 0; }
.wf-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.money-in { position: relative; flex: 1 1 110px; max-width: 160px; }
.money-in span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-weight: 800; }
.money-in input { width: 100%; height: 46px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 12px 0 28px; font: 800 17px/1 var(--f); }
.money-in input:focus { outline: none; border-color: var(--ink); }

.versions .list { border-top: 1px solid var(--line); }
.vrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); }
.vrow .row { border-bottom: 0; grid-template-columns: 40px minmax(0, 1fr) auto; padding-right: 0; }
.vrow.focus { background: var(--pink-soft); border-radius: 12px; }
.heart-icon { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; }
.heart-icon[aria-pressed="true"] { color: var(--pink); }
.heart-icon:disabled { opacity: .3; cursor: default; }

/* Wishlist */
.wrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid var(--line); }
.wrow .row { border-bottom: 0; }
.hit-pill { display: inline-block; font-size: 12.5px; font-weight: 800; color: #FFFFFF; background: var(--green); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.x-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; }

/* Help */

(() => {
'use strict';

/* ------------------------------------------------------------------ helpers */
const $ = (s, el = document) => el.querySelector(s);
const enc = encodeURIComponent;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const money = (n, cur = 'USD') => n == null ? '—' : (cur === 'EUR' ? '€' : '$') + (n >= 1000 ? Math.round(n).toLocaleString('en-US') : n.toFixed(2));

const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const humanize = k => cap(String(k).replace(/([a-z])([A-Z0-9])/g, '$1 $2').replace(/([0-9])([a-zA-Z])/g, '$1 $2').toLowerCase());

const STORES = [

/* ------------------------------------------------------------------ deal math
   Offer   { store, tag, kind: 'ask' | 'market', price, cur: 'USD' | 'EUR', url, stale? }

const OUTLIER = 0.6; // a listing more than 60% under the usual price is usually damaged, a proxy or mislabeled
function evalVariant(v) {
  const usd = ((v && v.offers) || []).filter(o => o.cur === 'USD' && o.price != null);
  const mk = usd.find(o => o.kind === 'market') || null;
  const market = mk ? mk.price : null;

  let best = asks.find(o => !isOut(o)) || null;

}

const A = {};

/* Magic via Scryfall */
const sfImg = (c, size) => (c.image_uris && c.image_uris[size]) || (c.card_faces && c.card_faces[0] && c.card_faces[0].image_uris && c.card_faces[0].image_uris[size]) || null;

async function sfList(url, signal, pages = 1) {

  return [...m.values()].map(g => {
    const p0 = g.printings[0];
    g.image = p0.image; g.imageLarge = p0.imageLarge; g.code = p0.id;
    g.sub = g.printings.length > 1 ? `${g.printings.length} versions` : setLine(p0);

}
A.swu = {
  async search(q, signal) {
    const [r] = await Promise.all([
      getJSON(`${SW}/cards/search?q=${enc(q)}`, { signal, ttl: 3 * HOUR, okStatus: [400, 404] }),
      swSetNames ? null : swSets(signal).catch(() => null),
    ]);
    return rankGroups(swGroups((r && r.data) || []), q).slice(0, 40);
  },
  async radar(signal) {
    const sets = await swSets(signal);
    const now = Date.now();
    const recent = sets.filter(s => s.isBaseSet && swDate(s.releaseDate) && swDate(s.releaseDate) <= now && (s.numberCards || 0) >= 100)
      .sort((a, b) => swDate(b.releaseDate) - swDate(a.releaseDate)).slice(0, 2);
    if (!recent.length) throw new NetError('SWU-DB didn’t list any recent sets.', 'http');
    const res = await Promise.allSettled(recent.map(s => getJSON(`${SW}/cards/${enc(s.setId)}`, { signal, ttl: 2 * HOUR })));
    const cards = res.flatMap(r => r.status === 'fulfilled' ? ((r.value && r.value.data) || []) : []);
    if (!cards.length) {
      const failed = res.find(r => r.status === 'rejected');
      throw failed ? failed.reason : new NetError('No prices came back for the newest sets.', 'http');
    }
    const deals = [];
    for (const c of cards) {
      const p = swPrinting(c);
      for (const v of p.variants) {
        const e = evalVariant(v);
        if (e.pct == null || e.market < 2 || e.pct < 0.08 || e.caution) continue;
        deals.push({
          game: 'swu', name: swName(c), image: p.image, code: p.id, price: e.best.price, ref: e.market, pct: e.pct,
          where: `${setLine(p)}${plainVersion(v.label) ? ', ' + v.label : ''}`, focus: p.id,
          group: { game: 'swu', key: norm(swName(c)), name: swName(c), baseName: c.Name, printings: [p], image: p.image, imageLarge: p.imageLarge, code: p.id, sub: setLine(p), partial: true },
        });
      }
    }
    return deals.sort((a, b) => b.pct - a.pct).slice(0, 30);
  },
  async refresh(items, signal) {
    const out = {};
    for (const w of items) {
      const i = w.pid.lastIndexOf('-');
      if (i < 1) continue;
      try {
        const c = await getJSON(`${SW}/cards/${enc(w.pid.slice(0, i))}/${enc(w.pid.slice(i + 1))}`, { signal, ttl: 30 * 60e3, okStatus: [404] });
        const v = c && swPrinting(c).variants.find(x => x.key === w.vkey);
        const e = v && evalVariant(v);
        if (e && e.best) out[w.id] = { price: e.best.price, url: e.best.url };
      } catch (err) { if (err.name === 'AbortError') throw err; }
    }
    return out;
  },
};

  state.radar[game] = { status: 'loading' };
  if (state.tab === 'deals' && state.game === game) renderDeals();

    const deals = await A[game].radar();
    state.radar[game] = { status: 'ok', deals, at: Date.now() };

async function runSearch(raw) {

  if (searchCtl) searchCtl.abort();
  const game = state.game;

  const ctl = searchCtl = new AbortController();

  const subBits = [p.number ? '#' + p.number : '', ver, p.rarity && p.rarity !== ver ? p.rarity : ''].filter(Boolean);
  const usual = e.market && e.best && e.best.price !== e.market ? `<span class="muted">usually ${money(e.market)}</span>` : '';
  const inner = `${thumb(p.image, g.game, p.setCode || p.number, 'sm')}<span class="row-main"><span class="name">${esc(p.setName || 'Unknown set')}</span><span class="sub">${esc(subBits.join(', '))}</span></span><span class="row-price">${e.best ? `<span class="price">${money(e.best.price)}</span>${usual}` : '<span class="muted">No price</span>'}</span>`;
  const main = e.best && e.best.url ? `<a class="row" href="${esc(e.best.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="row">${inner}</div>`;
  const form = detail.editing === wid && wid !== detail.holoWid ? watchForm(wid, e.best ? e.best.price : null) : '';
  return `<div class="vrow${p.id === detail.focusId ? ' focus' : ''}">${main}<button class="heart-icon" type="button" data-act="watch" data-p="${esc(p.id)}" data-v="${esc(v.key)}" aria-pressed="${on}" aria-label="${on ? 'Change or remove from wishlist' : 'Add this version to your wishlist'}"${e.best ? '' : ' disabled'}>${on ? HEART_ON : HEART}</button></div>${form}`;
}
function versionsBlock(g) {
  const rows = [];
  for (const p of g.printings || []) for (const v of p.variants) rows.push({ p, v, price: (evalVariant(v).best || {}).price ?? Infinity });
  if (!rows.length) return '';
  rows.sort((a, b) => a.price - b.price);
  if (detail.focusId) rows.sort((a, b) => (b.p.id === detail.focusId) - (a.p.id === detail.focusId));
  const limit = detail.showAll ? rows.length : 10;
  const title = rows.length === 1 ? 'This version' : `All versions (${rows.length}${g.more ? '+' : ''})`;
  return `<section class="versions"><h3>${title}</h3><div class="list">${rows.slice(0, limit).map(r => versionRow(g, r.p, r.v)).join('')}</div>${rows.length > limit ? `<p><button class="textlink" type="button" data-act="show-all">Show all ${rows.length}</button></p>` : ''}${g.partial ? `<p><button class="textlink" type="button" data-act="all-printings">See every ${esc(g.name)} card</button></p>` : ''}</section>`;
}
function renderDetail() {
  if (!detail) return;
  const g = detail.group, G = GAMES[g.game];
  detail.holoWid = null;
  $('#sheetTitle').textContent = g.name;
  const fp = detail.focusId ? (g.printings || []).find(p => p.id === detail.focusId) : null;
  const big = (fp && (fp.imageLarge || fp.image)) || g.imageLarge || g.image;
  const heroCode = fp ? (g.game === 'yugioh' ? fp.setCode.split('-')[0] : fp.setCode) : g.code;
  let html = `<div class="d-hero">${thumb(big, g.game, heroCode, 'lg')}<div><h2 class="d-name">${esc(g.name)}</h2><p class="d-sub">${esc(g.sub || G.name)}</p>${g.link ? `<a class="textlink" href="${esc(g.link)}" target="_blank" rel="noopener">Card details</a>` : ''}</div></div>`;
  if (detail.status === 'loading') html += loadingBlock('Getting every version…', 3);
  else if (detail.status === 'error') html += errorNote(detail.err, 'retry-detail');
  else html += bestBlock(g) + appsBlock(g) + versionsBlock(g);
  html += `<p class="fine">${esc(G.fine || '')}</p>`;
  $('#sheetBody').innerHTML = html;
}
function toggleWatchForm(pid, vkey) {
  if (!detail) return;
  const wid = watchId(detail.group.game, pid, vkey);
  detail.editing = detail.editing === wid ? null : wid;
  renderDetail();
  if (detail.editing) {
    requestAnimationFrame(() => {
      const inp = $('#wt');
      if (inp) { inp.focus({ preventScroll: true }); inp.select(); inp.closest('.wf').scrollIntoView({ block: 'nearest' }); }
    });
  }
}
function saveWatchForm(f) {
  if (!detail) return;
  const wid = f.dataset.wid;
  const target = Math.round(parseFloat(f.elements.target.value) * 100) / 100;
  if (!(target > 0)) { toast('Enter a price above $0.'); return; }
  const [game, pid, vkey] = splitWid(wid);
  const g = detail.group;
  const pv = findPV(g, pid, vkey);
  if (!pv) return;
  const e = evalVariant(pv.v);
  const existing = state.watch.find(w => w.id === wid);
  if (existing) existing.target = target;
  else {
    const ver = plainVersion(pv.v.label);
    state.watch.unshift({
      id: wid, game, pid, vkey, name: g.name,
      where: `${setLine(pv.p)}${ver ? ', ' + ver : ''}`,
      image: pv.p.image || g.image || null, code: pv.p.setCode || g.code || '', target,
      start: e.best ? e.best.price : null, last: e.best ? e.best.price : null, lastAt: Date.now(), url: e.best ? e.best.url : null,
      extra: game === 'yugioh' ? { cardId: g.cardId } : (game === 'lorcana' || game === 'swu') ? { q: g.baseName || g.name } : null,
    });
  }
  saveWatch();
  detail.editing = null;
  renderDetail();
  toast(existing ? 'Price saved' : 'Added to wishlist');
}

/* ------------------------------------------------------------------ wishlist */
async function checkWatch() {
  if (state.checking || !state.watch.length) return;
  state.checking = true;
  renderWatch();
  const byGame = {};
  for (const w of state.watch) if (A[w.game]) (byGame[w.game] = byGame[w.game] || []).push(w);
  for (const [game, items] of Object.entries(byGame)) {
    let res = null;
    try { res = await A[game].refresh(items); } catch { res = null; }
    for (const w of items) {
      const r = res && res[w.id];
      if (r && r.price != null) { w.last = r.price; w.url = r.url || w.url; w.lastAt = Date.now(); w.err = false; }
      else w.err = true;
    }
    saveWatch();
    if (state.tab === 'watch') renderWatch();
  }
  state.checking = false;
  store.set('lastCheck', Date.now());
  if (state.tab === 'watch') renderWatch();
  const hits = state.watch.filter(isHit).length;
  const failed = state.watch.filter(w => w.err).length;
  toast(hits ? `${hits} card${hits > 1 ? 's are' : ' is'} at your price` : failed ? `Prices checked. ${failed} card${failed > 1 ? 's' : ''} couldn’t be checked.` : 'Prices checked. Nothing at your price yet.');
}
function watchRow(w) {
  const hit = isHit(w);
  const d = w.last != null && w.start != null ? w.last - w.start : null;
  const change = d && Math.abs(d) >= 0.01 ? `${d < 0 ? 'Down' : 'Up'} ${money(Math.abs(d))} since you added it` : '';
  const status = hit ? '<span class="hit-pill">At your price</span>' : `<span class="muted">Your price ${money(w.target)}</span>`;
  const sub = [w.where, change, w.err ? 'Last check didn’t work' : ''].filter(Boolean).join('. ');
  return `<div class="wrow"><button class="row" type="button" data-act="w-open" data-wid="${esc(w.id)}">${thumb(w.image, w.game, w.code)}<span class="row-main"><span class="name">${esc(w.name)}</span><span class="sub">${esc(sub)}</span></span><span class="row-price"><span class="price">${money(w.last)}</span>${status}</span></button><button class="x-btn" type="button" data-act="w-remove" data-wid="${esc(w.id)}" aria-label="Remove ${esc(w.name)} from wishlist">${X_ICON}</button></div>`;
}
function renderWatch() {
  const items = state.watch.map((w, i) => [w, i]).sort((a, b) => (isHit(b[0]) - isHit(a[0])) || a[1] - b[1]).map(x => x[0]);
  const last = store.get('lastCheck', null);
  let html = `<div class="head"><h1>Wishlist</h1>${items.length ? `<button class="btn small" type="button" data-act="check"${state.checking ? ' disabled' : ''}>${state.checking ? 'Checking…' : 'Check prices'}</button>` : ''}</div>`;
  if (!items.length) {
    html += `<p class="hint">Cards you’re waiting on, with the price you’d pay.</p><div class="note"><p>Your wishlist is empty. Open any card, tap Add to wishlist and set the price you’d pay.</p><button class="btn small" type="button" data-tab="hunt">Find a card</button></div>`;
  } else {
    html += `<p class="hint">${last ? `Checked ${esc(ago(last))}. ` : ''}Cards at your price show first. Saved on this phone.</p><div class="list">${items.map(watchRow).join('')}</div>`;
  }
  $('#view-watch').innerHTML = html;
}

/* ------------------------------------------------------------------ help */
function openInfo() {
  sheetAbort.abort();
  sheetAbort = new AbortController();
  detail = null;
  openSheet();
  $('#sheetTitle').textContent = 'How Snagr works';
  $('#sheetBody').innerHTML = `<section class="info">
    <h3>Deals</h3>
    <p>For Pokémon, One Piece and Star Wars: Unlimited, a deal is a seller on TCGplayer asking less than the card’s usual price. For Magic and Yu-Gi-Oh!, it’s a version of a card that costs much less than the usual version.</p>
    <h3>Check other apps</h3>
    <p>Every card has buttons that open the same search on TCGplayer, eBay, Mercari, Whatnot, Facebook Marketplace, Amazon and more. Riftbound, Digimon, Flesh and Blood, Dragon Ball and Gundam work this way only, because no free price source covers them yet.</p>
    <h3>Where prices come from</h3>
    <ul>
      <li><a href="https://pokemontcg.io" target="_blank" rel="noopener">Pokémon TCG API</a></li>
      <li><a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a> for Magic</li>
      <li><a href="https://ygoprodeck.com" target="_blank" rel="noopener">YGOPRODeck</a> for Yu-Gi-Oh!</li>
      <li><a href="https://optcgapi.com" target="_blank" rel="noopener">OPTCG API</a> for One Piece</li>
      <li><a href="https://lorcast.com" target="_blank" rel="noopener">Lorcast</a> for Lorcana</li>
      <li><a href="https://www.swu-db.com" target="_blank" rel="noopener">SWU-DB</a> for Star Wars: Unlimited</li>
    </ul>
    <h3>Before you buy</h3>
    <p>The cheapest seller can have a played copy, another language or high shipping. Check the condition and the total on the store page.</p>
    <h3>Your wishlist</h3>
    <p>It’s saved in this browser on this phone and isn’t uploaded anywhere.</p>
    <h3>Add Snagr to your home screen</h3>
    <p>Open this page in Safari or Chrome, tap Share (or ⋮), then Add to Home Screen.</p>
    <p class="fine">Snagr isn’t affiliated with any card game publisher or store. Card names and pictures belong to their owners.</p>
  </section>`;
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click', ev => {
  if (ev.target.closest('#toastAction')) { const run = toastRun; $('#toast').hidden = true; toastRun = null; if (run) run(); return; }
  const t = ev.target.closest('[data-act],[data-game],[data-tab],[data-close]');
  if (!t) return;
  if (t.dataset.game) { setGame(t.dataset.game); return; }
  if (t.dataset.tab) { if (t.tagName === 'A') ev.preventDefault(); if (!$('#sheet').hidden) closeSheet(); setTab(t.dataset.tab); return; }
  if (t.hasAttribute('data-close')) { closeSheet(); return; }
  const act = t.dataset.act;
  const deals = state.radar[state.game] && state.radar[state.game].deals;
  switch (act) {
    case 'info': openInfo(); break;
    case 'refresh-radar': refreshRadar(); break;
    case 'retry-radar': ensureRadar(true); break;
    case 'retry-search': runSearch(state.q); break;
    case 'retry-detail': if (detail && detail.retry) detail.retry(); break;
    case 'clear-search': $('#q').value = ''; runSearch(''); $('#q').focus(); break;
    case 'suggest': if (!$('#sheet').hidden) closeSheet(); $('#q').value = t.dataset.q; setTab('hunt'); runSearch(t.dataset.q); break;
    case 'open-deal': { const d = deals && deals[+t.dataset.i]; if (d && d.group) openGroup(d.group, d.focus); break; }
    case 'open-group': { const g = state.hunt.groups[+t.dataset.i]; if (g) openGroup(g); break; }
    case 'show-all': if (detail) { detail.showAll = true; renderDetail(); } break;
    case 'all-printings': { const name = detail && (detail.group.baseName || detail.group.name); closeSheet(); setTab('hunt'); $('#q').value = name || ''; runSearch(name || ''); break; }
    case 'watch': toggleWatchForm(t.dataset.p, t.dataset.v); break;
    case 'cancel-watch': if (detail) { detail.editing = null; renderDetail(); } break;
    case 'unwatch': removeWatch(t.dataset.wid, false); if (detail) { detail.editing = null; renderDetail(); } break;
    case 'check': checkWatch(); break;
    case 'w-open': openFromWatch(t.dataset.wid); break;
    case 'w-remove': removeWatch(t.dataset.wid, true); break;
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target;
  if (f.id === 'searchForm') { ev.preventDefault(); clearTimeout(searchTimer); runSearch($('#q').value); $('#q').blur(); return; }
  if (f.classList.contains('wf')) { ev.preventDefault(); saveWatchForm(f); }
});
$('#q').addEventListener('input', ev => { $('#clearQ').hidden = !ev.target.value; queueSearch(ev.target.value, 450); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* ------------------------------------------------------------------ start */
renderGames();
renderBadge();
const startTab = (location.hash || '').replace('#', '');
setTab(['deals', 'hunt', 'watch'].includes(startTab) ? startTab : 'deals');
})();
</script>
